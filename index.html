    <!-- No-flash theme init: set dark/light class before paint -->
    <script>
      (function () {
        // Dark is the default aesthetic; light only when the visitor toggled it.
        try {
          var stored = localStorage.getItem('trustapk-theme');
          var theme = stored || 'dark';
          document.documentElement.classList.toggle('dark', theme !== 'light');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
